name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (single EXE)
        run: pyinstaller manga_downloader.spec

      - name: Verify EXE exists
        run: |
          if (!(Test-Path "dist\MangaDownloader.exe")) {
            Write-Error "dist\MangaDownloader.exe was not created!"
            exit 1
          }
          $mb = [math]::Round((Get-Item "dist\MangaDownloader.exe").Length / 1MB, 1)
          Write-Host "MangaDownloader.exe ready - $mb MB"

      - name: Bundle EXE + config + readme into ZIP
        run: |
          New-Item -ItemType Directory -Force -Path release_bundle
          Copy-Item dist\MangaDownloader.exe release_bundle\MangaDownloader.exe
          Copy-Item config.yaml              release_bundle\config.yaml
          Copy-Item INSTALL.txt              release_bundle\INSTALL.txt
          Compress-Archive -Path release_bundle\* -DestinationPath MangaDownloader-windows.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaDownloader-exe
          path: dist\MangaDownloader.exe
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaDownloader-windows-zip
          path: MangaDownloader-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MangaDownloader.exe
            MangaDownloader-windows.zip
          generate_release_notes: true
