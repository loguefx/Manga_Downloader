name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"          # e.g. v1.0.0  → also creates a GitHub Release
  workflow_dispatch:  # allow manual trigger from the GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create releases

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller manga_downloader.spec

      # ── Bundle default config ────────────────────────────────────────────────
      - name: Copy default config.yaml into dist
        run: |
          Copy-Item config.yaml dist\MangaDownloader\config.yaml

      # ── Zip the output folder ────────────────────────────────────────────────
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\MangaDownloader\* -DestinationPath MangaDownloader-windows.zip

      # ── Upload build artifact (always) ───────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaDownloader-windows
          path: MangaDownloader-windows.zip
          retention-days: 30

      # ── Create GitHub Release (only on version tags) ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MangaDownloader-windows.zip
          generate_release_notes: true
