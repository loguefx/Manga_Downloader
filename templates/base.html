<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Manga Downloader{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">&#128366;</span>
      <span class="brand-name">Manga Downloader</span>
    </div>
    <div class="navbar-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/config" class="nav-link {% if request.path == '/config' %}active{% endif %}">Config</a>
      <span class="nav-version" id="appVersion">v1.0.3</span>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
