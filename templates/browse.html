{% extends "base.html" %}
{% block title %}Browse MangaDex{% endblock %}

{% block content %}
<div class="browse-header">
  <div>
    <h1 class="browse-title">Browse MangaDex</h1>
    <p class="browse-subtitle">Find manga to add to your library — click a cover to add it instantly.</p>
  </div>
  <a href="/config" class="btn btn-secondary" style="flex-shrink:0">&#9881; Config</a>
</div>

<!-- ── Filters bar ── -->
<div class="browse-filters">
  <div class="browse-search-wrap">
    <input type="text" id="browseSearch" placeholder="Search by title..." autocomplete="off" />
    <button class="btn btn-primary" onclick="browseSearch()">&#128269; Search</button>
    <button class="btn btn-secondary" onclick="browseClear()">Clear</button>
  </div>
  <div class="browse-sort-wrap">
    <label>Sort:</label>
    <button class="sort-btn active" data-sort="popular"  onclick="browseSetSort(this)">&#128293; Popular</button>
    <button class="sort-btn"        data-sort="latest"   onclick="browseSetSort(this)">&#128337; Latest Upload</button>
    <button class="sort-btn"        data-sort="new"      onclick="browseSetSort(this)">&#10024; Newest</button>
    <button class="sort-btn"        data-sort="az"       onclick="browseSetSort(this)">&#127250; A – Z</button>
  </div>
</div>

<!-- ── Results info ── -->
<div class="browse-info">
  <span id="browseInfo">Loading...</span>
  <span id="browseLibraryHint" class="browse-library-hint hidden">
    &#9989; = already in your library
  </span>
</div>

<!-- ── Manga grid ── -->
<div id="browseGrid" class="browse-grid"></div>

<!-- ── Load more / spinner ── -->
<div class="browse-footer">
  <div id="browseSpinner" class="browse-spinner hidden">
    <div class="spinner"></div><span>Loading...</span>
  </div>
  <button id="browseLoadMore" class="btn btn-secondary browse-load-more hidden"
          onclick="browseLoadMore()">Load More</button>
</div>

<!-- ── Toast notification ── -->
<div id="browseToast" class="browse-toast hidden"></div>
{% endblock %}

{% block scripts %}
<script>
/* ── State ── */
let _browseSort    = "popular";
let _browseQuery   = "";
let _browseOffset  = 0;
let _browseTotal   = 0;
let _browsing      = false;
let _browseInLib   = new Set();
let _browseSeenIds = new Set();   // dedup guard across Load More pages

/* ── Init ── */
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("browseSearch").addEventListener("keydown", e => {
    if (e.key === "Enter") browseSearch();
  });
  browseLoad(true);
});

/* ── Helpers ── */
function browseShowSpinner(v) {
  document.getElementById("browseSpinner").classList.toggle("hidden", !v);
}
function browseShowLoadMore(v) {
  document.getElementById("browseLoadMore").classList.toggle("hidden", !v);
}

/* ── Load results ── */
async function browseLoad(reset) {
  if (_browsing) return;
  _browsing = true;

  if (reset) {
    _browseOffset  = 0;
    _browseSeenIds = new Set();
    document.getElementById("browseGrid").innerHTML = "";
    document.getElementById("browseLibraryHint").classList.add("hidden");
  }

  browseShowSpinner(true);
  browseShowLoadMore(false);

  const q = encodeURIComponent(_browseQuery);
  const url = `/api/browse/mangadex?q=${q}&sort=${_browseSort}&offset=${_browseOffset}`;

  try {
    const data = await fetch(url).then(r => r.json());
    _browseTotal  = data.total || 0;
    _browseOffset += data.results.length;

    const grid = document.getElementById("browseGrid");

    // Advance by the raw MangaDex page size (not the filtered count) so
    // the next request doesn't overlap and produce duplicate cards.
    _browseOffset = data.next_offset ?? (_browseOffset + 24);

    const newIds = [];
    data.results.forEach(m => {
      // Skip if this ID was already rendered (cross-page duplicate from MangaDex)
      if (_browseSeenIds.has(m.id)) return;
      _browseSeenIds.add(m.id);

      if (m.in_library) _browseInLib.add(m.id);
      grid.insertAdjacentHTML("beforeend", buildBrowseCard(m));
      if (!m.in_library) newIds.push(m.id);
    });

    const shown = grid.querySelectorAll(".browse-card").length;
    document.getElementById("browseInfo").textContent =
      `Showing ${shown} English title${shown !== 1 ? "s" : ""}`;

    if (_browseInLib.size > 0)
      document.getElementById("browseLibraryHint").classList.remove("hidden");

    browseShowLoadMore(_browseOffset < _browseTotal && data.results.length > 0);

    // Run downloadability checks in the background and update buttons proactively
    checkAllDownloadable(newIds);
  } catch(e) {
    document.getElementById("browseInfo").textContent = "Failed to load — is the server running?";
  }

  browseShowSpinner(false);
  _browsing = false;
}

/* ── Build a single card ── */
function buildBrowseCard(m) {
  const inLib   = m.in_library;
  const cover   = m.cover_url
    ? `<img class="bc-cover" src="${m.cover_url}" alt="" loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.outerHTML='<div class=\\'bc-cover bc-cover-placeholder\\'>&#128366;</div>'" />`
    : `<div class="bc-cover bc-cover-placeholder">&#128366;</div>`;

  const tags = (m.tags || []).map(t =>
    `<span class="bc-tag">${escHtml(t)}</span>`).join("");

  const statusCls = {
    "Ongoing": "status-ongoing", "Completed": "status-completed",
    "Hiatus": "status-hiatus",   "Cancelled": "status-cancelled",
  }[m.status] || "";

  const addBtn = inLib
    ? `<button class="btn-bc-add in-library" id="add-${m.id}" disabled>&#9989; In Library</button>`
    : `<button class="btn-bc-add" id="add-${m.id}" data-manga-id="${m.id}"
              onclick="browseAddToLibrary('${m.id}','${escHtml(m.title).replace(/'/g,"\\'")}')">
         &#43; Add to Library
       </button>`;

  return `
  <div class="browse-card ${inLib ? "bc-in-library" : ""}" id="bc-${m.id}">
    <div class="bc-cover-wrap">${cover}</div>
    <div class="bc-body">
      <div class="bc-title" title="${escHtml(m.title)}">${escHtml(m.title)}</div>
      ${m.status ? `<span class="bc-status ${statusCls}">${m.status}</span>` : ""}
      <div class="bc-tags">${tags}</div>
      <div class="bc-desc">${escHtml(m.description || "No description available.")}</div>
      ${addBtn}
    </div>
  </div>`;
}

/* ── Background downloadability checks ── */
// After cards render, silently check each one and disable buttons that can't
// be downloaded (e.g. One Piece / Viz-hosted chapters with externalUrl).
const _blockedIds = new Set();

async function checkAllDownloadable(ids) {
  if (!ids.length) return;
  // Run checks with a small concurrency limit to avoid hammering MangaDex
  const BATCH = 4;
  for (let i = 0; i < ids.length; i += BATCH) {
    const slice = ids.slice(i, i + BATCH);
    await Promise.allSettled(slice.map(id => checkOneDownloadable(id)));
  }
}

async function checkOneDownloadable(mangaId) {
  try {
    const res = await fetch(`/api/check/mangadex/${mangaId}`).then(r => r.json());
    if (!res.downloadable) {
      _blockedIds.add(mangaId);
      markNotDownloadable(mangaId, res.reason);
    }
  } catch (_) { /* silently ignore network errors */ }
}

function markNotDownloadable(mangaId, reason) {
  // Use querySelectorAll so stale duplicates (if any slipped through) all get marked
  document.querySelectorAll(`[id="add-${mangaId}"]`).forEach(btn => {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "⛔ Not on MangaDex";
    btn.style.cssText = "background:#5a1a1a;color:#e07070;cursor:not-allowed;border-color:#7a2a2a";
    btn.title = reason || "Chapters are not downloadable through MangaDex.";
  });
  document.querySelectorAll(`[id="bc-${mangaId}"]`).forEach(card => {
    card.classList.add("bc-blocked");
  });
}

/* ── Controls ── */
function browseSearch() {
  _browseQuery = document.getElementById("browseSearch").value.trim();
  browseLoad(true);
}
function browseClear() {
  _browseQuery = "";
  document.getElementById("browseSearch").value = "";
  browseLoad(true);
}
function browseSetSort(btn) {
  document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  _browseSort = btn.dataset.sort;
  browseLoad(true);
}
function browseLoadMore() {
  browseLoad(false);
}

/* ── Add to library + auto-download + Komga rescan ── */
async function browseAddToLibrary(mangaId, title) {
  const btn  = document.getElementById(`add-${mangaId}`);
  const card = document.getElementById(`bc-${mangaId}`);
  if (btn) { btn.disabled = true; btn.textContent = "Checking..."; }

  try {
    // 0. Verify chapters are actually downloadable through MangaDex
    // (may already be known from background check)
    if (!_blockedIds.has(mangaId)) {
      const check = await fetch(`/api/check/mangadex/${mangaId}`).then(r => r.json());
      if (!check.downloadable) {
        _blockedIds.add(mangaId);
        showBrowseToast(`Cannot add "${title}": ${check.reason}`, false);
        markNotDownloadable(mangaId, check.reason);
        return;
      }
    } else {
      // Already confirmed blocked by background check
      showBrowseToast(`"${title}" is not downloadable through MangaDex.`, false);
      if (btn) btn.disabled = true;
      return;
    }

    // 1. Check already in library
    const cfg = await fetch("/api/config").then(r => r.json());
    if ((cfg.manga ?? []).some(m => m.id === mangaId)) {
      showBrowseToast(`Already in library: ${title}`, false);
      if (btn) { btn.textContent = "✓ In Library"; btn.classList.add("in-library"); }
      return;
    }

    // 2. Save to config
    if (!cfg.manga) cfg.manga = [];
    cfg.manga.push({ id: mangaId, name: title });
    const saveRes = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cfg),
    }).then(r => r.json());
    if (!saveRes.success) throw new Error(saveRes.message);

    _browseInLib.add(mangaId);
    card?.classList.add("bc-in-library");
    document.getElementById("browseLibraryHint").classList.remove("hidden");

    // 3. Kick off download scan for this manga
    if (btn) { btn.textContent = "⬇ Downloading..."; }
    showBrowseToast(`Added "${title}" — starting download...`, true);

    const scanRes = await fetch("/api/scan/single", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: mangaId, source: "MangaDex" }),
    }).then(r => r.json());

    if (scanRes.success) {
      if (btn) { btn.textContent = "⏳ Downloading..."; btn.classList.add("in-library"); }
      showBrowseToast(`"${title}" is downloading — Komga will update when done!`, true);
      // Poll until the scan finishes, then update button
      pollUntilDone(mangaId, title, btn);
    } else {
      // Scan busy (another scan running) — still saved, just not downloading yet
      if (btn) { btn.textContent = "✓ Saved (scan later)"; btn.classList.add("in-library"); }
      showBrowseToast(`Saved "${title}". Another scan is running — it will download on the next cycle.`, false);
    }
  } catch(e) {
    showBrowseToast("Error: " + e.message, false);
    if (btn) { btn.disabled = false; btn.textContent = "+ Add to Library"; }
  }
}

/* ── Poll until active scan finishes ── */
async function pollUntilDone(mangaId, title, btn) {
  const start = Date.now();
  const maxWait = 30 * 60 * 1000; // 30 min max poll
  while (Date.now() - start < maxWait) {
    await new Promise(r => setTimeout(r, 5000));
    try {
      const s = await fetch("/api/status").then(r => r.json());
      if (!s.scanning) {
        if (btn) { btn.textContent = "✓ In Library"; }
        showBrowseToast(`"${title}" scan complete — check your library for new chapters.`, true);
        return;
      }
    } catch(_) { /* ignore transient errors */ }
  }
  if (btn) { btn.textContent = "✓ In Library"; }
}

/* ── Toast ── */
let _toastTimer = null;
function showBrowseToast(msg, success) {
  const el = document.getElementById("browseToast");
  el.textContent = msg;
  el.className = `browse-toast ${success ? "toast-success" : "toast-error"}`;
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.add("hidden"), 3500);
}
</script>
{% endblock %}
